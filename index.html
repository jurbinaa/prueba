<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ulaloud — Vue.js</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 640px; }
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #42b883, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle { color: #64748b; font-size: 1rem; margin-bottom: 2rem; }
        .card {
            background: #171725;
            border: 1px solid #2a2a3d;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .counter {
            font-size: 3rem;
            font-weight: 800;
            color: #42b883;
            font-family: ui-monospace, monospace;
            margin: 0.5rem 0;
        }
        button {
            font-size: 1rem;
            font-weight: 600;
            padding: 0.6rem 1.4rem;
            margin: 0 0.3rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #42b883;
            color: #0f0f1a;
            transition: opacity 0.15s;
        }
        button:hover { opacity: 0.85; }
        button.secondary { background: #2a2a3d; color: #e0e0e0; }
        .clock {
            font-family: ui-monospace, monospace;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            background: rgba(66, 184, 131, 0.12);
            border: 1px solid rgba(66, 184, 131, 0.35);
            color: #42b883;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 1rem;
        }
        .badge::before { content: "●"; font-size: 0.7rem; }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #475569; }
        code { background: #1e293b; padding: 0.15rem 0.4rem; border-radius: 4px; color: #42b883; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <h1>Ulaloud</h1>
        <p class="subtitle">Vue 3 vía CDN — sin build, sin Node</p>

        <div class="card">
            <div class="clock">{{ now }}</div>
            <div class="counter">{{ count }}</div>
            <button @click="count++">+ incrementar</button>
            <button class="secondary" @click="count = 0">reset</button>
        </div>

        <div class="badge">Vue reactivo — funcionando en el cliente</div>

        <p class="footer">
            Servido como archivo estático por nginx — Vue corre 100% en tu navegador.<br>
            Cada <code>git push</code> a <code>main</code> + restart actualiza esta página.
        </p>
    </div>

    <script>
        const { createApp, ref, onMounted, onUnmounted } = Vue;

        createApp({
            setup() {
                const count = ref(0);
                const now = ref(new Date().toLocaleTimeString('es-ES'));
                let timer;

                onMounted(() => {
                    timer = setInterval(() => {
                        now.value = new Date().toLocaleTimeString('es-ES');
                    }, 1000);
                });
                onUnmounted(() => clearInterval(timer));

                return { count, now };
            }
        }).mount('#app');
    </script>
</body>
</html>
